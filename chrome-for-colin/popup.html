<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      width: 320px; 
      padding: 15px; 
      font-family: Arial, sans-serif; 
    }
    h3 { margin-top: 0; }
    input { 
      width: 100%; 
      padding: 10px; 
      margin: 10px 0; 
      box-sizing: border-box;
    }
    button { 
      width: 100%; 
      padding: 12px; 
      background: #4285f4; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #3367d6; }
    #status { margin-top: 12px; font-size: 14px; min-height: 20px; }
    #match-count { font-weight: bold; color: #34a853; }
  </style>
</head>
<body>
  <h3>Word Scanner</h3>
  
  <input type="text" id="wordInput" placeholder="Enter words (comma separated)" autofocus>
  
  <button id="scanBtn">Scan Page</button>
  
  <div id="status"></div>
  <div id="match-count"></div>

  <script src="popup.js"></script>
</body>
</html>
